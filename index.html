<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PassItOn – Campus materials marketplace</title>
<style>
:root{--bg:#f6faf6;--card:#fff;--ink:#16261c;--mute:#5c7064;--line:#dbe7dd;--g:#1f8a4c;--gd:#14663a;--gl:#e3f4ea;--warn:#b4531a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17251c;--ink:#e8f3ea;--mute:#98ae9f;--line:#27382d;--g:#3fb56f;--gd:#7fd6a1;--gl:#1d3426;--warn:#e89a62}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17251c;--ink:#e8f3ea;--mute:#98ae9f;--line:#27382d;--g:#3fb56f;--gd:#7fd6a1;--gl:#1d3426;--warn:#e89a62}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap;gap:8px 12px}
.logo{font:700 20px Georgia,serif;color:var(--gd);text-decoration:none}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;white-space:nowrap}
nav a:hover{background:var(--gl)}
.hero{padding:56px 0 40px;text-align:left}
.hero h1{font-size:clamp(34px,6vw,56px);max-width:15ch;color:var(--gd)}
.hero p{max-width:46ch;color:var(--mute);font-size:18px;margin:14px 0 24px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;border:2px solid var(--g);background:var(--g);color:#fff;padding:11px 20px;border-radius:99px;font:600 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn.alt{background:transparent;color:var(--gd)}
.btn.alt:hover{background:var(--gl)}
.btn.sm{padding:7px 14px;font-size:14px}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px}
.step{background:var(--gl);border-radius:18px;padding:18px}
.step b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;margin-bottom:8px}
.step h3{font-size:18px;margin-bottom:4px}
.step p{margin:0;color:var(--mute);font-size:15px}
section{padding:40px 0}
section>.wrap>h2{font-size:30px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 20px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.5;filter:grayscale(1)}
.ph{height:130px;overflow:hidden;display:grid;place-items:center;font-size:42px;background:var(--gl)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:17px}
.meta{font-size:13px;color:var(--mute)}
.price{font-weight:700;color:var(--gd);font-size:18px}
.tag{display:inline-block;background:var(--gl);color:var(--gd);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.contact{background:var(--gl);border-radius:10px;padding:6px 10px;font-size:14px;width:100%}
.empty{padding:28px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:18px}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
form .full{grid-column:1/-1}
.msg{color:var(--gd);font-weight:600;min-height:1.4em}
.reqs{display:grid;gap:12px}
.req{background:var(--card);border:1px solid
